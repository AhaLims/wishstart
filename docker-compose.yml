services:
  redis:
    image: redis:alpine
    container_name: wishstar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - wishstar-network

  backend:
    build: ./backend
    container_name: wishstar-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - wishstar-network

  frontend:
    build: ./frontend
    container_name: wishstar-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wishstar-network

networks:
  wishstar-network:
    driver: bridge

volumes:
  redis-data:
